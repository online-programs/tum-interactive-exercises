
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Ordering</title>

<style>
:root {
  --blue: #0065BD;
  --orange: #E37222;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  color: #222;
  background: #fff;
}

.task {
  width: min(100%, 900px);
  margin: auto;
}

.bank {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  padding: 12px;
  background: #fffde0;
  border: 1px solid #333;
  border-radius: 9px;
  box-shadow: 0 2px 4px #0002;
  min-height: 235px;
}

.group {
  min-width: 0;
  background: #4d8ed0;
  border: 1px solid #222;
  border-radius: 7px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  cursor: grab;
  user-select: none;
  touch-action: pan-y;
}

.group.dragging { opacity: .4; }

.group-title {
  color: white;
  font-size: clamp(10px, 1.8vw, 14px);
  font-weight: bold;
  text-align: center;
  min-height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px;
}

.substeps {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.substep {
  background: #f1f1f1;
  border-radius: 3px;
  min-height: 42px;
  padding: 6px 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: clamp(9px, 1.5vw, 12px);
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.slots {
  margin-top: 28px;
  padding: 12px;
  background: #aaa;
  border: 1px solid #333;
  border-radius: 9px;
  box-shadow: 0 2px 4px #0002;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.slot {
  min-width: 0;
  height: 190px;
  background: white;
  border: 1px dashed #555;
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 6px;
  gap: 5px;
}

.slot.over {
  background: #e8f3ff;
  border: 2px solid var(--blue);
}

.slot-number {
  text-align: center;
  font-size: 14px;
}

.slot .group { flex: 1; }
.slot .group-title { min-height: 24px; }
.slot .substep { min-height: 26px; }

.controls {
  display: flex;
  justify-content: flex-end;
}

button {
  border: 1px solid #aaa;
  background: #eee;
  color: #777;
  padding: 8px 18px;
  font-size: 13px;
  cursor: pointer;
  min-width: 78px;
}

button:enabled {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}

.feedback {
  min-height: 20px;
  text-align: right;
  font-size: 13px;
  padding: 4px 2px;
}

.correct { color: #176b35; }
.incorrect { color: #a32920; }

@media (max-width: 560px) {
  body { padding: 6px; }

  .bank, .slots {
    gap: 4px;
    padding: 6px;
  }

  .group {
    padding: 4px;
    gap: 3px;
  }

  .substep {
    min-height: 52px;
    padding: 4px 2px;
  }

  .slot {
    height: 170px;
    padding: 4px;
  }

  .slot .substep { min-height: 30px; }

  .slots { margin-top: 18px; }
}
</style>
</head>

<body>
<div class="task">

<section class="bank" id="bank">

  <div class="group" draggable="true" data-id="weaving">
    <div class="group-title">Weaving</div>
    <div class="substeps">
      <div class="substep">Yarn is then woven</div>
      <div class="substep">Cloth is brushed</div>
      <div class="substep">Sanforized</div>
    </div>
  </div>

  <div class="group" draggable="true" data-id="materials">
    <div class="group-title">Materials</div>
    <div class="substeps">
      <div class="substep">Cotton</div>
      <div class="substep">Dye</div>
    </div>
  </div>

  <div class="group" draggable="true" data-id="process">
    <div class="group-title">Process</div>
    <div class="substeps">
      <div class="substep">Prepare cotton yarn</div>
      <div class="substep">Make thread stronger</div>
    </div>
  </div>

  <div class="group" draggable="true" data-id="jeans">
    <div class="group-title">Making the blue jeans</div>
    <div class="substeps">
      <div class="substep">Pressing</div>
      <div class="substep">Design of jeans</div>
      <div class="substep">Sewing</div>
    </div>
  </div>

  <div class="group" draggable="true" data-id="dyeing">
    <div class="group-title">Dyeing</div>
    <div class="substeps">
      <div class="substep">Dipped in the indigo mixture</div>
      <div class="substep">Coating</div>
    </div>
  </div>

</section>

<section class="slots" id="slots">
  <div class="slot"><div class="slot-number">1</div></div>
  <div class="slot"><div class="slot-number">2</div></div>
  <div class="slot"><div class="slot-number">3</div></div>
  <div class="slot"><div class="slot-number">4</div></div>
  <div class="slot"><div class="slot-number">5</div></div>
</section>

<div class="controls">
  <button id="check" disabled>CHECK</button>
</div>

<div class="feedback" id="feedback" aria-live="polite"></div>

</div>

<script>
(() => {

  const bank = document.getElementById('bank');
  const slots = [...document.querySelectorAll('.slot')];
  const check = document.getElementById('check');
  const feedback = document.getElementById('feedback');

  const correctOrder = [
    'materials',
    'process',
    'dyeing',
    'weaving',
    'jeans'
  ];

  let dragged = null;

  function updateButton() {
    check.disabled = !slots.every(
      slot => slot.querySelector('.group')
    );

    feedback.textContent = '';
    feedback.className = 'feedback';
  }

  function makeDraggable(group) {

    group.addEventListener('dragstart', e => {
      dragged = group;
      group.classList.add('dragging');

      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', group.dataset.id);
    });

    group.addEventListener('dragend', () => {
      group.classList.remove('dragging');
      dragged = null;

      slots.forEach(slot =>
        slot.classList.remove('over')
      );
    });
  }

  document.querySelectorAll('.group')
    .forEach(makeDraggable);

  function place(group, target) {

    if (!group || !target) return;

    const existing = target.querySelector('.group');
    const parent = group.parentElement;

    if (existing && existing !== group) {
      if (parent.classList.contains('slot')) {
        parent.appendChild(existing);
      } else {
        bank.appendChild(existing);
      }
    }

    target.appendChild(group);
    updateButton();
  }

  [...slots, bank].forEach(target => {

    target.addEventListener('dragover', e => {
      e.preventDefault();

      if (target.classList.contains('slot')) {
        target.classList.add('over');
      }
    });

    target.addEventListener('dragleave', () => {
      target.classList.remove('over');
    });

    target.addEventListener('drop', e => {
      e.preventDefault();
      target.classList.remove('over');

      if (!dragged) return;

      if (target.classList.contains('slot')) {
        place(dragged, target);
      } else {
        if (dragged.parentElement.classList.contains('slot')) {
          bank.appendChild(dragged);
        }

        updateButton();
      }
    });
  });

  // Touch support
  let pointerGroup = null;

  document.addEventListener('pointerdown', e => {
    const group = e.target.closest('.group');

    if (group && e.pointerType !== 'mouse') {
      pointerGroup = group;
    }
  });

  document.addEventListener('pointerup', e => {

    if (!pointerGroup) return;

    const target = document
      .elementFromPoint(e.clientX, e.clientY)
      ?.closest('.slot');

    if (target) {
      place(pointerGroup, target);
    }

    pointerGroup = null;
  });

  // Check answer
  check.addEventListener('click', () => {

    const answer = slots.map(
      slot => slot.querySelector('.group')?.dataset.id
    );

    const isCorrect = answer.every(
      (id, index) => id === correctOrder[index]
    );

    feedback.textContent = isCorrect
      ? 'Correct!'
      : 'Not quite. Try again.';

    feedback.className =
      'feedback ' + (isCorrect ? 'correct' : 'incorrect');
  });

  updateButton();

})();
</script>

</body>
</html>
